name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality, build and tests
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce pull request flow
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main && "$HEAD_BRANCH" != dev ]]; then
            echo "Release PRs must originate from dev."
            exit 1
          fi
          if [[ "$BASE_BRANCH" == dev && "$HEAD_BRANCH" != feat_* && "$HEAD_BRANCH" != dependabot/* ]]; then
            echo "Feature PRs must use feat_<module>_<purpose> branches."
            exit 1
          fi
      - name: Record toolchain
        run: xcodebuild -version && swift --version
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'
      - name: Validate source, tests, smoke and all Apple platform builds
        run: ./scripts/check.sh
      - name: Run iOS unit and UI tests
        timeout-minutes: 15
        run: ./scripts/test-ios.sh
      - name: Run adopted Munie client unit and native UI tests
        timeout-minutes: 20
        run: ./scripts/test-remodex-ios.sh
      - name: Upload build and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            build/*.log
            build/core-performance*.json
            packages/MunieCore/.build/debug/codecov/
            packages/MunieRemote/.build/debug/codecov/
            build/product-guardian.json
            .build/debug/codecov/
            build/ios-tests.*/Results.xcresult
            build/remodex-ios-tests.*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
