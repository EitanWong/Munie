name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  identity-sdk:
    name: Apple identity SDK evidence
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This compiles and links a minimal public API probe; it never runs the
      # product, generated library, Keychain or network. Unavailable API evidence
      # is distinct from a probe execution error and is retained in report.json.
      - name: Record public identity API compilation and linkage
        run: |
          mkdir -p build
          python3 scripts/probe-identity-sdk.py --output-dir build/identity-sdk
      - name: Upload identity SDK evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-sdk-evidence
          path: |
            build/identity-sdk/
            !build/identity-sdk/module-cache/
          if-no-files-found: error
          retention-days: 14
  identity-lifecycle:
    name: Isolated iOS identity lifecycle
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build isolated research app with reviewed dependencies
        run: ./scripts/build-ios-identity-probe.sh
      - name: Exercise owned credentials across fresh simulator app processes
        run: |
          python3 scripts/probe-ios-identity.py \
            --app build/identity-ios/DerivedData/Build/Products/Release-iphonesimulator/MunieIdentityResearch.app \
            --report build/ios-identity-probe.json
      - name: Recover an owned key before its persistent reference is journaled
        run: |
          python3 scripts/probe-ios-identity.py \
            --app build/identity-ios/DerivedData/Build/Products/Release-iphonesimulator/MunieIdentityResearch.app \
            --fault-case after-key-add --report build/ios-identity-after-key-add.json
      - name: Recover an owned certificate before its persistent reference is journaled
        run: |
          python3 scripts/probe-ios-identity.py \
            --app build/identity-ios/DerivedData/Build/Products/Release-iphonesimulator/MunieIdentityResearch.app \
            --fault-case after-certificate-add --report build/ios-identity-after-certificate-add.json
      - name: Upload isolated identity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-identity-evidence
          path: |
            build/ios-identity-*.json
            build/identity-ios/build.log
            build/identity-ios/ownership-checks.log
            build/identity-ios/MunieIdentityResearch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 14
  quality:
    name: Quality, build and tests
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce pull request flow
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main && "$HEAD_BRANCH" != dev ]]; then
            echo "Release PRs must originate from dev."
            exit 1
          fi
          if [[ "$BASE_BRANCH" == dev && "$HEAD_BRANCH" != feat_* && "$HEAD_BRANCH" != dependabot/* ]]; then
            echo "Feature PRs must use feat_<module>_<purpose> branches."
            exit 1
          fi
      - name: Record toolchain
        run: xcodebuild -version && swift --version
      - name: Validate source, tests, smoke and all Apple platform builds
        run: ./scripts/check.sh
      - name: Run iOS unit and UI tests
        timeout-minutes: 15
        run: ./scripts/test-ios.sh
      - name: Upload build and coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence
          path: |
            build/*.log
            build/core-performance*.json
            packages/MunieCore/.build/debug/codecov/
            .build/debug/codecov/
            build/ios-tests.*/Results.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
