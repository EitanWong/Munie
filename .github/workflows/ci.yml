name: CI
on:
  push:
    branches: [main, dev, 'feat_*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce pull request flow
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_BRANCH" == main && "$HEAD_BRANCH" != dev ]]; then
            echo "Release PRs must originate from dev."
            exit 1
          fi
          if [[ "$BASE_BRANCH" == dev && "$HEAD_BRANCH" != feat_* && "$HEAD_BRANCH" != dependabot/* ]]; then
            echo "Feature PRs must use feat_<module>_<purpose> branches."
            exit 1
          fi
      - name: Record toolchain
        run: xcodebuild -version && swift --version
      - name: Validate source, tests, smoke and iOS build
        run: ./scripts/check.sh
      - name: Upload build and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          path: |
            build/*.log
            packages/MunieCore/.build/debug/codecov/
            .build/debug/codecov/
          if-no-files-found: ignore
          retention-days: 14
  ios-tests:
    name: iOS unit and UI tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run simulator tests
        run: ./scripts/test-ios.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: build/ios-tests.*/Results.xcresult
          if-no-files-found: ignore
          retention-days: 14
